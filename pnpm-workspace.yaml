packages:
  - packages/*
  - sandbox/*

minimumReleaseAge: 10080

allowBuilds:
  '@swc/core': true
  canvas: true
  esbuild: true
  sharp: true
overrides:
  postcss@<8.5.10: ^8.5.31
  # esbuild@0.28.1 より新しいバージョンが minimumReleaseAge を超過したタイミングで削除可
  esbuild@<=0.24.2: '>=0.28.2'
  esbuild@>=0.17.0 <0.28.1: '>=0.28.2'
  tar@<=7.5.15: '>=7.5.22'
  js-yaml@>=4.0.0 <=5.2.1: '>=5.4.3'
  '@babel/core@<=7.29.0': '>=8.0.7'
  # react-docgen が Babel 8 に未対応のため、Babel 7 を使用する（reactjs/react-docgen#1102）
  'react-docgen>@babel/core': '^7.28.6'
  sharp@<0.35.5: '>=0.35.5'
  nanoid@<3.3.18: '>=3.3.18 <7'
  browserslist@<=4.28.6: '>=4.29.4'
  postcss-selector-parser@>=6.1.0 <6.1.3: '>=7.1.7'
  brace-expansion@>=2.0.0 <2.1.7: '>=2.1.7 <3.0.0'
  brace-expansion@>=4.0.0 <5.0.12: '>=5.0.12'
  source-map-js@>=1.0.0 <1.2.2: '>=1.2.2'
  shell-quote@>=1.8.4 <1.11.0: '>=1.11.0'
  smol-toml@<=1.8.0: '>=1.9.0'
  qs@<6.16.0: '>=6.16.2'
  colord@<2.9.4: '>=2.9.7'
auditConfig:
  ignoreGhsas:
    # HINT: braces@<=3.0.3 のスタック枯渇によるDoS。修正版が未リリースで、tailwindcss@3 系の最新版(3.4.19)も
    # chokidar@3 / micromatch@4 / fast-glob@3 経由で braces@3 に依存しているため、バージョン更新では解消できない。
    # tailwindcss が braces を使うのは設定ファイルの content に書いた glob の展開のみで、外部入力を扱わないためignoreする。
    # braces の修正版がリリースされるか、Tailwind CSS v4 へ移行したタイミングで削除する
    - GHSA-vfj7-8cjw-p6xm
    # HINT: deepmerge@4.2.0-4.3.1 のprototype pollution(CVSS 2.7、low)。修正版は未リリース。
    # packages/charts の chartConfig.ts で、利用者がReact props経由で静的に渡すChart.jsオプションの
    # マージにのみ使用しており、HTTPリクエスト等の動的な外部入力を直接扱わないためignoreする。
    # deepmerge の修正版がリリースされるか、deepmergeに依存しない実装へ置き換えたタイミングで削除する
    - GHSA-gcqx-w48m-w2h4
minimumReleaseAgeExclude:
  # Renovate security update: qs@6.16.2
  - qs@6.16.2
