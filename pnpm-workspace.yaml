packages:
  - packages/*
  - sandbox/*

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  # Security update: esbuild@0.28.1
  - esbuild@0.28.1
  - '@esbuild/aix-ppc64@0.28.1'
  - '@esbuild/android-arm@0.28.1'
  - '@esbuild/android-arm64@0.28.1'
  - '@esbuild/android-x64@0.28.1'
  - '@esbuild/darwin-arm64@0.28.1'
  - '@esbuild/darwin-x64@0.28.1'
  - '@esbuild/freebsd-arm64@0.28.1'
  - '@esbuild/freebsd-x64@0.28.1'
  - '@esbuild/linux-arm@0.28.1'
  - '@esbuild/linux-arm64@0.28.1'
  - '@esbuild/linux-ia32@0.28.1'
  - '@esbuild/linux-loong64@0.28.1'
  - '@esbuild/linux-mips64el@0.28.1'
  - '@esbuild/linux-ppc64@0.28.1'
  - '@esbuild/linux-riscv64@0.28.1'
  - '@esbuild/linux-s390x@0.28.1'
  - '@esbuild/linux-x64@0.28.1'
  - '@esbuild/netbsd-arm64@0.28.1'
  - '@esbuild/netbsd-x64@0.28.1'
  - '@esbuild/openbsd-arm64@0.28.1'
  - '@esbuild/openbsd-x64@0.28.1'
  - '@esbuild/openharmony-arm64@0.28.1'
  - '@esbuild/sunos-x64@0.28.1'
  - '@esbuild/win32-arm64@0.28.1'
  - '@esbuild/win32-ia32@0.28.1'
  - '@esbuild/win32-x64@0.28.1'
  # Renovate security update: tar@7.5.21
  - tar@7.5.21
  # Security update: next@16.2.11
  - next@16.2.11
  - '@next/env@16.2.11'
  - '@next/swc-darwin-arm64@16.2.11'
  - '@next/swc-darwin-x64@16.2.11'
  - '@next/swc-linux-arm64-gnu@16.2.11'
  - '@next/swc-linux-arm64-musl@16.2.11'
  - '@next/swc-linux-x64-gnu@16.2.11'
  - '@next/swc-linux-x64-musl@16.2.11'
  - '@next/swc-win32-arm64-msvc@16.2.11'
  - '@next/swc-win32-x64-msvc@16.2.11'
  # Renovate security update: postcss@8.5.18
  - postcss@8.5.18
allowBuilds:
  '@swc/core': true
  canvas: true
  esbuild: true
  sharp: true
# brace-expansion@2.x は GHSA-mh99-v99m-4gvg の影響を受けないが、advisory の vulnerable versions が <=5.0.7 と広い範囲を
# 指定しているため tailwindcss>sucrase>glob>minimatch@9>brace-expansion@2.x が誤検知される。
# 実際の 5.x 系の脆弱バージョン (>=5.0.0 <5.0.8) は overrides で対処済みのためここで無視する。
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
overrides:
  postcss@<8.5.10: ^8.5.19
  esbuild@<=0.24.2: '>=0.28.1'
  esbuild@>=0.17.0 <0.28.1: '>=0.28.1'
  tar@<=7.5.15: '>=7.5.21'
  vite@>=7.0.0 <=7.3.4: '>=7.3.6'
  react-draggable: 4.5.0
  js-yaml@>=4.0.0 <=4.1.1: '>=4.3.0'
  '@babel/core@<=7.29.0': '>=7.29.7'
  sharp@<0.35.0: '>=0.35.3'
  brace-expansion@>=5.0.0 <5.0.8: '>=5.0.8'
