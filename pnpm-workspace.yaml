packages:
  - packages/*
  - sandbox/*

minimumReleaseAge: 10080

allowBuilds:
  canvas: true
  esbuild: true
  sharp: true
overrides:
  js-yaml@>=4.0.0 <=5.2.1: '>=5.5.0'
  # react-docgen が Babel 8 に未対応のため、Babel 7 を使用する（reactjs/react-docgen#1102）
  'react-docgen>@babel/core': '^7.29.13'
  # minimatch@11はCJSのdefault exportを廃止しておりeslint-plugin-import(minimatch@3系依存)が
  # 壊れるため、全体ではなくsucraseが使うglob/minimatchにのみ適用する
  'sucrase>glob': '>=14.0.6'
auditConfig:
  ignoreGhsas:
    # HINT: braces@<=3.0.3 のスタック枯渇によるDoS。修正版が未リリースで、tailwindcss@3 系の最新版(3.4.19)も
    # chokidar@3 / micromatch@4 / fast-glob@3 経由で braces@3 に依存しているため、バージョン更新では解消できない。
    # tailwindcss が braces を使うのは設定ファイルの content に書いた glob の展開のみで、外部入力を扱わないためignoreする。
    # braces の修正版がリリースされるか、Tailwind CSS v4 へ移行したタイミングで削除する
    - GHSA-vfj7-8cjw-p6xm
    # HINT: deepmerge@4.2.0-4.3.1 のprototype pollution(CVSS 2.7、low)。修正版は未リリース。
    # packages/charts の chartConfig.ts で、利用者がReact props経由で静的に渡すChart.jsオプションの
    # マージにのみ使用しており、HTTPリクエスト等の動的な外部入力を直接扱わないためignoreする。
    # deepmerge の修正版がリリースされるか、deepmergeに依存しない実装へ置き換えたタイミングで削除する
    - GHSA-gcqx-w48m-w2h4
    # HINT: picomatch@<=4.0.7 のReDoS(CVSS 8.7、high)。修正版は未リリース。
    # tailwindcss@3 系が chokidar / micromatch / fast-glob 経由で依存しており、braces と同様
    # 設定ファイルの content に書いた glob パターンの展開にのみ使用する。開発者が静的に書いた
    # パターンのみを扱い、HTTPリクエスト等の外部入力を直接処理しないためignoreする。
    # picomatch の修正版がリリースされるか、tailwindcss v4 へ移行したタイミングで削除する
    - GHSA-fc5q-39xc-vjpf
minimumReleaseAgeExclude:
  # eslint-config-smarthr@14.18.0とその依存のeslint-plugin-smarthr@6.32.0: ユーザー指示により
  # minimumReleaseAge(7日)の待機を一時解除する(7日経過後にこのエントリ自体は削除可)
  - eslint-config-smarthr@14.18.0
  - eslint-plugin-smarthr@6.32.0
