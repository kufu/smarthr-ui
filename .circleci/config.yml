version: 2.1

executors:
  node-maintenance:
    docker:
      - image: cimg/node:22.23.4
        auth:
          username: smarthrinc
          password: $DOCKER_HUB_ACCESS_TOKEN
  node-active-lts:
    docker:
      - image: cimg/node:24.22.1
        auth:
          username: smarthrinc
          password: $DOCKER_HUB_ACCESS_TOKEN
  node-active-lts-browsers:
    docker:
      - image: cimg/node:24.22.1-browsers
        auth:
          username: smarthrinc
          password: $DOCKER_HUB_ACCESS_TOKEN
commands:
  setup-for-test:
    steps:
      - checkout
      # Download and cache dependencies
      - restore_cache:
          keys:
            - dependencies-test-{{ checksum "package.json" }}-{{ checksum "pnpm-lock.yaml" }}
            # fallback to using the latest cache if no exact match is found
            - modules-cache-
      - run: |
          sudo npm install -g corepack@latest
          sudo corepack enable
          sudo corepack prepare
          pnpm install
      - save_cache:
          paths:
            - node_modules
          key: dependencies-test-{{ checksum "package.json" }}-{{ checksum "pnpm-lock.yaml" }}
  # rich-text-editor の lint:tsc とテストは smarthr-ui のビルド成果物を参照するため、
  # 先に本体をビルドしておく必要がある
  build-smarthr-ui:
    steps:
      # 計測用（PRのマージ前に削除する）
      - run:
          name: pnpm ui build (measure)
          shell: /bin/bash -eo pipefail
          command: |
            CG=/sys/fs/cgroup
            if [ -f $CG/memory.current ]; then
              CUR=$CG/memory.current; STAT_KEY=anon; LIMIT=$(cat $CG/memory.max)
            else
              CUR=$CG/memory/memory.usage_in_bytes; STAT_KEY=rss; LIMIT=$(cat $CG/memory/memory.limit_in_bytes)
            fi
            STAT=$(dirname $CUR)/memory.stat
            anon() { awk -v k=$STAT_KEY '$1 == k { print $2 }' $STAT; }
            echo "MEASURE before usage=$(cat $CUR) anon=$(anon) limit=$LIMIT"
            (
              peak=0; peak_anon=0
              while true; do
                v=$(cat $CUR); a=$(anon)
                (( v > peak )) && peak=$v
                (( a > peak_anon )) && peak_anon=$a
                echo "$peak $peak_anon" > /tmp/mem-peak
                sleep 0.1
              done
            ) &
            SAMPLER=$!
            start=$(date +%s%N)
            pnpm ui build
            end=$(date +%s%N)
            kill $SAMPLER
            read peak peak_anon < /tmp/mem-peak
            echo "MEASURE build_ms=$(( (end - start) / 1000000 )) peak_usage=$peak peak_anon=$peak_anon limit=$LIMIT"
  check-source:
    steps:
      - run: pnpm ui lint
      - run: pnpm rte lint
  audit:
    steps:
      - checkout
      - run: pnpm audit --prod
  run-npm-test:
    steps:
      - run: pnpm ui test
      - run: pnpm rte test
  # SCとしてつかえるかどうかのテストを行っているが、費用対効果が薄いためoffにしています
  # 良いテスト方法を発見した場合置き換えます 2026/02/05
  # run-e2e-test:
  #   steps:
  #     - run:
  #         name: build and store smarthr-ui package
  #         working_directory: packages/smarthr-ui
  #         command: npx yalc publish
  #     - run:
  #         name: Setup Next.js sandbox
  #         working_directory: sandbox/next
  #         command: npx yalc add smarthr-ui
  #     - run:
  #         name: Start Next.js sandbox
  #         working_directory: sandbox/next
  #         command: pnpm dev
  #         background: true
  #     - run:
  #         name: Run E2E Test
  #         working_directory: sandbox/next
  #         command: |
  #           pnpm playwright install chromium
  #           pnpm playwright test
  run-chromatic:
    steps:
      - checkout
      - run: pnpm ui run chromatic --project-token=${CHROMATIC_PROJECT_TOKEN} --exit-zero-on-changes --only-changed --storybook-base-dir=packages/smarthr-ui
  run-chromatic-master:
    steps:
      - checkout
      - run: STORYBOOK_NODE_ENV="production" pnpm ui run chromatic --project-token=${CHROMATIC_PROJECT_TOKEN} --auto-accept-changes --only-changed --storybook-base-dir=packages/smarthr-ui
  install-noto-sans-cjk-jp:
    steps:
      - run:
          name: Install NotoSansCJK JP
          command: |
            mkdir /tmp/fonts
            cd /tmp/fonts
            wget https://noto-website-2.storage.googleapis.com/pkgs/NotoSansCJKjp-hinted.zip
            unzip NotoSansCJKjp-hinted.zip
            mkdir -p ~/.fonts
            cp *otf ~/.fonts
            fc-cache -f -v
            fc-match --all
            rm -rf /tmp/fonts
jobs:
  node-maintenance:
    executor: node-maintenance
    resource_class: medium
    steps:
      - setup-for-test
      - build-smarthr-ui
      - check-source
      - run-npm-test
  node-active-lts:
    executor: node-active-lts
    resource_class: medium
    steps:
      - setup-for-test
      - build-smarthr-ui
      - check-source
      - run-npm-test
  # e2e-test:
  #   executor: node-active-lts-browsers
  #   working_directory: ~/repo
  #   resource_class: medium+
  #   steps:
  #     - setup-for-test
  #     - run-e2e-test
  chromatic-deployment:
    executor: node-active-lts
    resource_class: medium+
    steps:
      - setup-for-test
      - run-chromatic
  chromatic-deployment-master:
    executor: node-active-lts
    resource_class: medium+
    steps:
      - setup-for-test
      - run-chromatic-master
  audit:
    executor: node-active-lts
    resource_class: medium
    steps:
      - setup-for-test
      - audit
workflows:
  multiple_builds:
    jobs:
      - node-maintenance:
          context: smarthr-dockerhub
      - node-active-lts:
          context: smarthr-dockerhub
      # - e2e-test:
      #     context: smarthr-dockerhub
      - audit:
          context: smarthr-dockerhub
      - chromatic-deployment:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore:
                - master
          context: smarthr-dockerhub
      - chromatic-deployment-master:
          filters:
            branches:
              only:
                - master
          context: smarthr-dockerhub
