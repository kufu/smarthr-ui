name: release

on:
  push:
    branches:
      - master

env:
  NPM_CONFIG_BEFORE: ''
  PNPM_CONFIG_MINIMUM_RELEASE_AGE: '1440' # 1 day

jobs:
  release_please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      # HINT: release-please は未リリース時に文字列 'false' を返す。
      # GitHub Actions の if は空文字以外を真として扱うため、必ず == 'true' で比較する。
      releases_created: ${{ steps.release_please.outputs.releases_created }}
      smarthr_ui_released: ${{ steps.release_please.outputs['packages/smarthr-ui--release_created'] }}
      charts_released: ${{ steps.release_please.outputs['packages/charts--release_created'] }}
      rich_text_editor_released: ${{ steps.release_please.outputs['packages/rich-text-editor--release_created'] }}
    steps:
      - name: Set NPM_CONFIG_BEFORE
        run: |
          echo "NPM_CONFIG_BEFORE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release_please
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    needs: release_please
    if: ${{ needs.release_please.outputs.releases_created == 'true' }}
    steps:
      - name: Set NPM_CONFIG_BEFORE
        run: |
          echo "NPM_CONFIG_BEFORE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: 'package.json'
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile

      # charts と rich-text-editor のビルドは smarthr-ui の lib を参照するため、
      # 本体が公開対象かどうかに関わらず先にビルドする
      - name: Build smarthr-ui
        run: pnpm --filter smarthr-ui run build

      # smarthr-ui を先に公開する。rich-text-editor の peer が指す本体版が
      # 実在しない状態で editor を公開しないため
      - name: Publish smarthr-ui
        if: ${{ needs.release_please.outputs.smarthr_ui_released == 'true' }}
        run: pnpm --filter smarthr-ui publish --no-git-checks --access public --provenance
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Publish charts
        if: ${{ needs.release_please.outputs.charts_released == 'true' }}
        run: pnpm --filter @smarthr/smarthr-ui-charts publish --no-git-checks --access public --provenance
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Publish rich-text-editor
        if: ${{ needs.release_please.outputs.rich_text_editor_released == 'true' }}
        run: pnpm --filter @smarthr/smarthr-ui-rich-text-editor publish --no-git-checks --access public --provenance
        env:
          NPM_CONFIG_PROVENANCE: true
